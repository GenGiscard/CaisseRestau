<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caisse · Les Jardins du Val d’Ornain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F3EC; --paper:#FFFFFF; --ink:#23283F; --ink2:#62667A; --line:#E2DED2;
  --navy:#262B45; --navy-ink:#F3F1EA; --sage:#74844A; --sage-soft:#EBEFDD; --sage-ink:#4E5A2E;
  --warn:#A94B28; --warn-soft:#F7E6DC; --chip:#EAE6DB; --occ:#262B45; --occ-ink:#F3F1EA; --ready:#5E8A3A; --ready-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(35,40,63,.07),0 6px 18px rgba(35,40,63,.06);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--navy);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161927; --paper:#1F2336; --ink:#ECEAE3; --ink2:#A3A7B8; --line:#333852;
    --navy:#0E1120; --navy-ink:#ECEAE3; --sage:#A6B676; --sage-soft:#283020; --sage-ink:#C7D59A;
    --warn:#E3906B; --warn-soft:#3A251D; --chip:#2A2F46; --occ:#A6B676; --occ-ink:#161927; --ready:#E3A53C; --ready-ink:#1B1508;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#161927; --paper:#1F2336; --ink:#ECEAE3; --ink2:#A3A7B8; --line:#333852;
  --navy:#0E1120; --navy-ink:#ECEAE3; --sage:#A6B676; --sage-soft:#283020; --sage-ink:#C7D59A;
  --warn:#E3906B; --warn-soft:#3A251D; --chip:#2A2F46; --occ:#A6B676; --occ-ink:#161927; --ready:#E3A53C; --ready-ink:#1B1508;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
main{flex:1;min-height:0;overflow:auto}
main.fixed{overflow:hidden;display:flex;flex-direction:column}

/* barre haute */
.top{background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:18px;padding:10px 18px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand .b1{font-size:10px;letter-spacing:.16em;opacity:.7}
.brand .b2{font-family:var(--serif);font-style:italic;font-weight:600;font-size:25px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button,.bnav button{padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px;opacity:.72;position:relative}
.tabs button.on{background:rgba(255,255,255,.12);opacity:1}
.badge{display:inline-block;min-width:19px;padding:1px 6px;border-radius:10px;background:var(--sage);color:#fff;font-size:11px;margin-left:6px;text-align:center}
.sync{font-size:12px;opacity:.65;white-space:nowrap}
.bnav{display:none;background:var(--navy);color:var(--navy-ink)}
.bnav button{flex:1;padding:12px 4px;font-size:13px}
.bnav button.on{opacity:1;background:rgba(255,255,255,.1)}
@media (max-width:760px){
  .tabs{display:none}
  .bnav{display:flex}
  .top{padding:8px 14px}
  .brand .b2{font-size:21px}
  .sync{margin-left:auto}
}
.alert{background:var(--warn-soft);color:var(--warn);padding:10px 16px;font-size:14px}

/* commun */
.wrap{max-width:1100px;margin:0 auto;padding:18px}
h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:22px 0 12px}
h2:first-child{margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;font-weight:600;background:var(--chip);min-height:46px}
.btn.pri{background:var(--navy);color:var(--navy-ink)}
:root[data-theme="dark"] .btn.pri{background:var(--sage);color:var(--occ-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--sage);color:var(--occ-ink)}}
.btn.sage{background:var(--sage);color:#fff}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.block{width:100%}
.muted{color:var(--ink2)}
.small{font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--ink2);font-weight:600}
.inp{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:16px}
textarea.inp{font-family:var(--sans);font-size:15px;line-height:1.45;resize:vertical}
.inp:focus{outline:2px solid var(--sage);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:14px;min-height:42px}
.chip.on{background:var(--navy);color:var(--navy-ink)}
:root[data-theme="dark"] .chip.on{background:var(--sage);color:var(--occ-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{background:var(--sage);color:var(--occ-ink)}}
.card{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:16px}

/* salle */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--paper);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12.5px;color:var(--ink2)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.tables{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}.tbl{min-height:92px;padding:10px}.tbl .n{font-size:30px}.wrap{padding:14px}}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.tbl{background:var(--paper);border:1.5px dashed var(--line);border-radius:14px;min-height:104px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.tbl .n{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1}
.tbl .l{font-size:12px;color:var(--ink2);margin-top:2px}
.tbl.occ{background:var(--occ);color:var(--occ-ink);border:1.5px solid var(--occ);box-shadow:var(--shadow)}
.tbl.occ .l{color:inherit;opacity:.75}
.tbl .tt{margin-top:auto;font-weight:700;font-size:16px}
.tbl .pp{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--sage);color:#fff;margin-top:6px}
.tbl.new{align-items:center;justify-content:center;color:var(--ink2);font-weight:600}

/* commande */
.cmd-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.cmd-head .ttl{font-family:var(--serif);font-size:25px;font-weight:600;margin-right:auto;padding-left:4px}
.cmd-head .btn{min-height:40px;padding:8px 13px;font-size:14px}
.cmd-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 390px}
.carte-pane{overflow:auto;min-height:0;padding:0 16px 20px}
.cats-wrap{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0 4px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.cats.sub .chip{min-height:36px;padding:7px 13px;font-size:13.5px;background:transparent;border:1.5px solid var(--line)}
.cats.sub .chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.is-grp::after{content:"";display:inline-block;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 0 3px 8px;opacity:.7}
.reg-t{font-size:12.5px;font-weight:700;color:var(--ink2);margin:16px 2px 8px}
.item.folder{border:1.5px solid var(--line);justify-content:center}
.item.folder .nm{font-family:var(--serif);font-size:21px;font-weight:600}
.item.folder .pr{justify-content:flex-start}
@media (min-width:861px){.cats{flex-wrap:wrap;overflow:visible}}
.cats::-webkit-scrollbar{display:none}
.cats .chip{white-space:nowrap;flex:none}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.item{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:12px;min-height:84px;display:flex;flex-direction:column;text-align:left;border:1.5px solid transparent;transition:border-color .2s}
.item .nm{font-weight:600;line-height:1.25}
.item .pr{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.item .pr span{color:var(--ink2);font-size:12px}
.item.added{border-color:var(--sage);animation:pop .45s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.item.divers{background:transparent;box-shadow:none;border:1.5px dashed var(--line);justify-content:center;align-items:center;color:var(--ink2);font-weight:600}
.empty-cat{padding:18px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink2)}
.ticket-pane{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tk-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.tk-head b{font-family:var(--serif);font-size:22px}
.tk-close{display:none}
.tk-lines{flex:1;overflow:auto;padding:0 8px}
.grp{font-size:12px;font-weight:700;color:var(--ink2);padding:12px 8px 4px}
.ln{display:grid;grid-template-columns:34px 1fr auto;gap:6px;width:100%;text-align:left;padding:9px 8px;border-radius:9px}
.ln:hover{background:var(--bg)}
.ln .q{font-weight:700}
.ln .d{font-size:12.5px;color:var(--ink2);white-space:pre-line;margin-top:2px}
.ln .nt{font-size:12.5px;color:var(--warn);margin-top:2px}
.ln .st{font-size:11px;font-weight:700;color:var(--sage-ink);background:var(--sage-soft);border-radius:5px;padding:1px 6px;margin-left:6px}
.ln .off{text-decoration:line-through;color:var(--ink2)}
.tk-empty{padding:30px 16px;color:var(--ink2);text-align:center}
.tk-foot{border-top:1px solid var(--line);padding:12px 16px 16px}
.tk-tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tk-tot b{font-size:26px}
.tk-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbar{display:none}
@media (max-width:860px){
  .cmd-body{grid-template-columns:1fr}
  .ticket-pane{display:none;position:fixed;inset:0;z-index:30;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ticket-pane.open{display:flex}
  .tk-close{display:inline-flex}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--navy);color:var(--navy-ink);font-weight:600;min-height:58px}
  .mbar b{font-size:19px}
  .items{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .cmd-head .ttl{font-size:22px}
}

/* encaissement */
.pay{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.pay{grid-template-columns:1fr}}
.due{text-align:center;padding:18px 10px}
.due .lbl{color:var(--ink2);font-size:14px}
.due .big{font-size:44px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}
.row.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.modes .btn{min-height:58px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:10px;background:var(--chip);font-size:22px;font-weight:600}
.stepper b{min-width:30px;text-align:center;font-size:20px}
.rendu{background:var(--sage-soft);color:var(--sage-ink);border-radius:12px;padding:14px;text-align:center;font-weight:600;margin-top:12px}
.rendu b{display:block;font-size:30px}
.paylist .pl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.x{width:34px;height:34px;border-radius:8px;background:var(--chip);font-weight:700}

/* ticket imprimable */
.ticket{background:#fff;color:#111;max-width:360px;margin:0 auto;padding:22px 20px;border-radius:6px;box-shadow:var(--shadow);font-size:13.5px}
.ticket .tn{font-family:var(--serif);font-size:22px;font-style:italic;text-align:center;font-weight:600}
.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed #999;margin:10px 0}
.ticket .r{display:flex;justify-content:space-between;gap:10px}
.ticket .dd{color:#555;font-size:12px;padding-left:18px;white-space:pre-line}
.ticket .tot{font-size:18px;font-weight:700}
.ticket table{width:100%;border-collapse:collapse;font-size:12px}
.ticket td,.ticket th{text-align:right;padding:2px 0}
.ticket td:first-child,.ticket th:first-child{text-align:left}
.actions{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap}

/* cuisine */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kcard{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.kcard .kh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--navy);color:var(--navy-ink)}
.kcard .kh b{font-family:var(--serif);font-size:22px}
.kcard .kh.late{background:var(--warn)}
.kl{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.kl .q{font-weight:700;margin-right:6px}
.kl .d{font-size:13px;color:var(--ink2);white-space:pre-line}
.kl .nt{font-size:13px;color:var(--warn)}
.kl.done{opacity:.45}
.kl.done .nm{text-decoration:line-through}
.kf{padding:10px 14px}

/* journal */
.jnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jnav .d{font-family:var(--serif);font-size:24px;font-weight:600;min-width:220px;text-align:center}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:760px){.jgrid{grid-template-columns:1fr}}
.tlist .ti{display:grid;grid-template-columns:44px 60px 1fr auto;gap:8px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.tbl-tva{width:100%;border-collapse:collapse;font-size:14px}
.tbl-tva th,.tbl-tva td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl-tva th:first-child,.tbl-tva td:first-child{text-align:left}

/* réglages */
.carte-edit .ce-cat{margin-top:18px}
.carte-edit .ce{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
.carte-edit .ce:hover{background:var(--bg)}
.add-line{color:var(--sage-ink);font-weight:600;padding:11px 12px}

/* feuille modale */
.ov{position:fixed;inset:0;background:rgba(20,22,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:540px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.ov{align-items:center}.sheet{border-radius:18px;padding-bottom:20px}}
.sheet h3{font-family:var(--serif);font-size:26px;font-weight:600;margin:0 0 4px}
.sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:14px}
.sheet .grp-t{font-weight:700;font-size:13px;color:var(--ink2);margin:14px 0 8px}
.sheet .foot{display:flex;gap:10px;margin-top:18px}
.sheet .foot .btn{flex:1}
.cv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cv .btn{min-height:56px;font-size:19px}
.confirm{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;margin-top:14px}
.confirm .foot{margin-top:10px}
.opt-list .btn{justify-content:flex-start;width:100%;margin-bottom:8px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--ink2)}
.loading .b2{font-family:var(--serif);font-style:italic;font-size:34px;color:var(--ink)}

@media (max-width:760px){.tables{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}.tbl{min-height:92px;padding:10px}.tbl .n{font-size:30px}}
.item .it-sub{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.25}
/* journée */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;margin-top:12px}
.daybar.off{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.daybar .btn{min-height:42px;padding:8px 14px}
.db-btns{display:flex;gap:8px;flex-wrap:wrap}
/* plats prêts */
.tbl.occ.ready{background:var(--ready);border-color:var(--ready);color:var(--ready-ink);animation:rdy 1.6s ease-in-out 3}
.tbl.occ.ready .pp{background:var(--ready-ink);color:var(--ready);font-weight:700}
@keyframes rdy{50%{transform:scale(1.04)}}
.badge.rdy{background:var(--ready);color:var(--ready-ink)}
.st.rdy{background:var(--ready);color:var(--ready-ink)}
.ready-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--ready);color:var(--ready-ink)}
.ready-bar .btn{background:var(--ready-ink);color:var(--ready);min-height:42px;padding:8px 14px}
/* bouton retour */
.btn.back{background:var(--navy);color:var(--navy-ink);padding-left:12px;gap:10px}
.btn.back::before{content:"";width:10px;height:10px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);margin-left:4px}
:root[data-theme="dark"] .btn.back{background:var(--sage);color:var(--occ-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.back{background:var(--sage);color:var(--occ-ink)}}
.cmd-head .btn.back{font-size:16px;padding-right:16px}
.cmd-head .btn{white-space:nowrap;flex:none}
.cmd-head .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:420px){.cmd-head .btn:not(.back){padding:10px 10px}.cmd-head .ttl{font-size:21px!important}}
@media print{
  body *{visibility:hidden}
  .ticket,.ticket *{visibility:visible}
  .ticket{position:absolute;left:0;top:0;box-shadow:none;width:76mm;max-width:none;padding:0}
}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="b2">Val d’Ornain</span><span>Ouverture de la caisse…</span></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= CARTE ================= */
var SAUCES=['B\u00e9arnaise','Poivre'];
var CUISSONS=['Bleu','Saignant','\u00c0 point','Bien cuit'];
var CARTE_ORIGINE={
  cats:[
    {id:'planches',nom:'Planches'},{id:'entrees',nom:'Entr\u00e9es'},{id:'viandes',nom:'Viandes'},
    {id:'vege',nom:'V\u00e9g\u00e9tarien'},{id:'poissons',nom:'Poissons'},{id:'paellas',nom:'Paellas'},
    {id:'fromages',nom:'Fromages'},{id:'desserts',nom:'Desserts'},{id:'formule',nom:'Formule'},
    {id:'g-boissons',nom:'Boissons'},

var FB='https://site-edel-default-rtdb.europe-west1.firebasedatabase.app';
function has(o,k){return Object.prototype.hasOwnProperty.call(o,k)}
function toArr(v){if(!v)return [];if(Array.isArray(v))return v.filter(function(x){return x!=null});return Object.keys(v).sort(function(a,b){return +a-+b}).map(function(k){return v[k]}).filter(function(x){return x!=null})}
function canon(v){
  if(v===null||v===undefined)return undefined;
  if(Array.isArray(v)){var a=v.map(canon).filter(function(x){return x!==undefined});return a.length?a:undefined}
  if(typeof v==='object'){var o={},n=0;Object.keys(v).sort().forEach(function(k){var c=canon(v[k]);if(c!==undefined){o[k]=c;n++}});return n?o:undefined}
  return v;
}
function same(a,b){return JSON.stringify(canon(a))===JSON.stringify(canon(b))}
function setAt(root,path,val){
  var parts=String(path||'').split('/').filter(Boolean);
  if(!parts.length)return val;
  root=(root&&typeof root==='object')?(Array.isArray(root)?root.slice():Object.assign({},root)):{};
  var cur=root;
  for(var i=0;i<parts.length-1;i++){var p=parts[i],nx=cur[p];cur[p]=(nx&&typeof nx==='object')?(Array.isArray(nx)?nx.slice():Object.assign({},nx)):{};cur=cur[p]}
  var last=parts[parts.length-1];
  if(val===null)delete cur[last];else cur[last]=val;
  return root;
}
function normTable(t){t=clone(t);t.lines=toArr(t.lines);t.payments=toArr(t.payments);t.remise=t.remise||null;return t}
function normConfig(c){
  c=clone(c);
  if(c.carte){
    c.carte.cats=toArr(c.carte.cats);
    c.carte.items=toArr(c.carte.items).map(function(it){
      if(it.variantes)it.variantes=toArr(it.variantes);
      if(it.opts)it.opts=toArr(it.opts).map(function(o){o.choix=toArr(o.choix);return o});
      if(it.formule)it.formule=toArr(it.formule).map(function(o){o.choix=toArr(o.choix);return o});
      return it;
    });
    if(!c.carte.cats.length)delete c.carte;
  }
  return c;
}
function normJour(day,v){
  v=v||{};var tk=v.tickets||{},keys=Object.keys(tk).sort();
  var sv=v.services||{},sk=Object.keys(sv).sort(),services=[];
  if(v.ouverture||v.cloture)services.push({key:'jour',ouverture:v.ouverture||null,cloture:v.cloture||null,legacy:true});
  sk.forEach(function(k){var x=sv[k]||{};services.push({key:k,ouverture:x.ouverture||null,cloture:x.cloture||null})});
  services.forEach(function(x,i){x.n=i+1;x.day=day;if(x.cloture){x.cloture=clone(x.cloture);x.cloture.modes=x.cloture.modes||{}}});
  return {day:day,services:services,tickets:keys.map(function(k,i){var t=clone(tk[k]);t.key=k;t.num=i+1;t.lignes=toArr(t.lignes);t.tva=toArr(t.tva);t.paiements=toArr(t.paiements);return t})};
}
var Store={
  mir:{tables:null,config:null},over:{},streams:{},pend:{},flushing:{},
  url:function(p,q){return FB+'/caisse/'+p+'.json'+(q||'')},
  start:function(){
    var self=this,got={t:false,c:false};
    this.open('tables','tables',function(v){self.mir.tables=v;got.t=true;if(got.c)data.ready=true;self.derive()});
    this.open('config','config',function(v){self.mir.config=v;got.c=true;if(got.t)data.ready=true;self.derive()});
    this.watchDay(addDays(dayKey(),-1));this.watchDay(dayKey());
    setTimeout(function(){if(!data.ready){data.err='connexion';data.ready=true;render()}},12000);
  },
  open:function(key,path,cb){
    var m=null,self=this,es;
    try{es=new EventSource(this.url(path))}catch(e){this.fail('connexion');return}
    es.addEventListener('put',function(e){var d=JSON.parse(e.data);m=setAt(m,d.path,d.data);cb(m)});
    es.addEventListener('patch',function(e){var d=JSON.parse(e.data),b=(d.path==='/'?'':d.path);Object.keys(d.data||{}).forEach(function(k){m=setAt(m,b+'/'+k,d.data[k])});cb(m)});
    es.addEventListener('cancel',function(){self.fail('refus')});
    es.addEventListener('auth_revoked',function(){self.fail('refus')});
    es.onopen=function(){if(!data.online){data.online=true;if(data.err==='connexion')data.err=null;render()}};
    es.onerror=function(){if(data.online!==false){data.online=false;render()}};
    this.streams[key]=es;
  },
  fail:function(c){data.err=c;data.ready=true;render()},
  derive:function(){
    var self=this,mt=this.mir.tables||{},t={};
    Object.keys(mt).forEach(function(k){if(mt[k])t[k]=normTable(mt[k])});
    Object.keys(this.over).forEach(function(p){
      if(p.indexOf('tables/')!==0)return;
      var id=p.slice(7),o=self.over[p];
      if(!self.flushing[p]&&same(t[id]||null,o)){delete self.over[p];return}
      if(o===null)delete t[id];else t[id]=o;
    });
    data.tables=t;
    var c=this.mir.config?normConfig(this.mir.config):null;
    if(has(this.over,'config')){if(!this.flushing.config&&same(c,this.over.config))delete this.over.config;else c=this.over.config}
    data.config=c;
    render();
  },
  put:function(path,body){
    var self=this;this.over[path]=body;this.pend[path]=body;this.derive();
    if(this.flushing[path])return;
    this.flushing[path]=true;
    (async function(){
      while(has(self.pend,path)){
        var b=self.pend[path];delete self.pend[path];
        try{var r=await fetch(self.url(path,'?x-http-method-override=PUT'),{method:'POST',body:JSON.stringify(b)});if(!r.ok)throw new Error(String(r.status))}
        catch(e){toast('Enregistrement impossible, v\u00e9rifiez la connexion')}
      }
      self.flushing[path]=false;
      var last=self.over[path];
      setTimeout(function(){if(!self.flushing[path]&&self.over[path]===last){delete self.over[path];self.derive()}},4000);
      self.derive();
    })();
  },
  watchDay:function(day){
    var keep=[dayKey(),addDays(dayKey(),-1),ui.jday],self=this;
    Object.keys(this.streams).forEach(function(k){if(k.indexOf('j:')===0&&keep.indexOf(k.slice(2))<0){self.streams[k].close();delete self.streams[k]}});
    if(this.streams['j:'+day])return;
    this.open('j:'+day,'jours/'+day,function(v){data.jours[day]=normJour(day,v);render()});
  },
  ecrire:async function(path,body){var r=await fetch(this.url(path,'?x-http-method-override=PUT'),{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw new Error(String(r.status))},
  saveTable:function(t){this.put('tables/'+t.id,clone(t))},
  deleteTable:function(id){this.put('tables/'+id,null)},
  saveConfig:function(c){this.put('config',clone(c))},
  appendTicket:async function(day,tk){
    var r=await fetch(this.url('jours/'+day+'/tickets'),{method:'POST',body:JSON.stringify(tk)});
    if(!r.ok)throw new Error(String(r.status));
    var key=(await r.json()).name,num=null;
    try{var s=await fetch(this.url('jours/'+day+'/tickets','?shallow=true'));var ks=Object.keys((await s.json())||{}).sort();num=ks.indexOf(key)+1}catch(e){}
    var out=clone(tk);out.key=key;out.num=num||'?';return out;
  }
};

/* ================= CALCULS ================= */
function lt(l){return l.offert?0:l.prix*l.qty}
function sousTotal(t){return t.lines.reduce(function(a,l){return a+lt(l)},0)}
function remiseM(t){var st=sousTotal(t);if(!t.remise)return 0;if(t.remise.type==='pct')return Math.round(st*t.remise.v/100);return Math.min(st,t.remise.v)}
function total(t){return sousTotal(t)-remiseM(t)}
function paye(t){return (t.payments||[]).reduce(function(a,p){return a+p.montant},0)}
function reste(t){return total(t)-paye(t)}
function nbArticles(t){return t.lines.reduce(function(a,l){return a+l.qty},0)}
function tvaDetail(lines,st,tot){
  var by={};lines.forEach(function(l){var k=String(l.tva||10);by[k]=(by[k]||0)+lt(l)});
  var rates=Object.keys(by).map(Number).sort(function(a,b){return a-b});
  var acc=0;
  return rates.map(function(r,i){
    var ttc=st?Math.round(by[String(r)]*tot/st):0;
    if(i===rates.length-1)ttc=tot-acc;acc+=ttc;
    var ht=Math.round(ttc/(1+r/100));
    return {taux:r,ttc:ttc,ht:ht,tva:ttc-ht};
  }).filter(function(x){return x.ttc!==0});
}
function tauxTxt(r){return String(r).replace('.',',')+'\u00a0%'}
function label(id){var t=data.tables[id];if(t&&t.label)return t.label;if(id.charAt(0)==='T')return 'Table '+id.slice(1);return id}
function curT(){return ui.cur?data.tables[ui.cur]:null}
function editT(){var t=curT();return t?clone(t):null}
function pretsCount(t){return t.lines.reduce(function(a,l){return a+(l.etat==='pret'&&l.cuisine!==false?l.qty:0)},0)}
function tablesPretes(){return Object.keys(data.tables).filter(function(k){return pretsCount(data.tables[k])>0}).length}

function svcTrouve(day,key){var j=jourInfo(day);if(!j)return null;for(var i=0;i<j.services.length;i++)if(j.services[i].key===key)return j.services[i];return null}
function svcActif(){
  var ds=[dayKey(),addDays(dayKey(),-1)];
  for(var d=0;d<ds.length;d++){var j=jourInfo(ds[d]);if(!j)continue;
    for(var i=j.services.length-1;i>=0;i--){var x=j.services[i];if(x.ouverture&&!x.cloture&&!x.legacy)return x}}
  return null;
}
function dernierCompte(){
  var ds=[dayKey(),addDays(dayKey(),-1)];
  for(var d=0;d<ds.length;d++){var j=jourInfo(ds[d]);if(!j)continue;
    for(var i=j.services.length-1;i>=0;i--){if(j.services[i].cloture)return j.services[i].cloture.especesComptees}}
  return null;
}

  tk.lignes.forEach(function(l){h+='<div class="r"><span>'+l.qty+' '+esc(l.nom)+'</span><span>'+(l.offert?'offert':eur(l.prix*l.qty))+'</span></div>'+(l.detail?'<div class="dd">'+esc(l.detail)+'</div>':'')});

/* ---- Cuisine ---- */
function vCuisine(){
  var list=[];
  Object.keys(data.tables).forEach(function(k){
    var t=data.tables[k];var ls=t.lines.filter(function(l){return l.cuisine!==false}).filter(function(l){return l.etat==='envoye'||(l.etat==='pret'&&l.t&&Date.now()-l.tp<120000)});
    if(ls.some(function(l){return l.etat==='envoye'})){var first=Math.min.apply(null,ls.map(function(l){return l.t||Date.now()}));list.push({t:t,ls:ls,first:first})}

  list.sort(function(a,b){return a.first-b.first});

}

/* ---- Journal ---- */
function jourStats(tks){
  var s={ca:0,n:tks.length,couv:0,remise:0,modes:{},tva:{}};
  tks.forEach(function(t){
    s.ca+=t.total;s.couv+=t.couverts||0;s.remise+=t.remise||0;
    t.paiements.forEach(function(p){s.modes[p.mode]=(s.modes[p.mode]||0)+p.montant});
    t.tva.forEach(function(x){var k=String(x.taux);if(!s.tva[k])s.tva[k]={ht:0,tva:0,ttc:0};s.tva[k].ht+=x.ht;s.tva[k].tva+=x.tva;s.tva[k].ttc+=x.ttc});
  });
  return s;
}
function vJournal(){
  var k=ui.jday,tks=jourTickets(k),s=jourStats(tks);
  var h='<div class="wrap"><div class="jnav"><button class="btn ghost" data-act="jday" data-d="-1">Veille</button><span class="d">'+dayLabel(k)+'</span><button class="btn ghost" data-act="jday" data-d="1" '+(k>=dayKey()?'disabled':'')+'>Lendemain</button><button class="btn" data-act="copier" '+(tks.length?'':'disabled')+' style="margin-left:auto">Copier pour Excel</button></div>';
  h+='<div class="stats" style="margin-top:14px"><div class="stat"><b class="num">'+eur(s.ca)+'</b><span>chiffre d\u2019affaires TTC</span></div><div class="stat"><b class="num">'+s.n+'</b><span>tickets</span></div><div class="stat"><b class="num">'+s.couv+'</b><span>couverts</span></div><div class="stat"><b class="num">'+eur(s.couv?Math.round(s.ca/s.couv):0)+'</b><span>moyenne par couvert</span></div></div>';
  h+='<div class="jgrid"><div class="card"><b>R\u00e8glements</b>';
  MODES.forEach(function(m){h+='<div class="row"><span>'+m+'</span><span class="num">'+eur(s.modes[m]||0)+'</span></div>'});
  if(s.remise)h+='<div class="row muted"><span>Remises accord\u00e9es</span><span class="num">'+eur(s.remise)+'</span></div>';
  h+='</div><div class="card"><b>TVA</b><table class="tbl-tva" style="margin-top:8px"><tr><th>Taux</th><th>HT</th><th>TVA</th><th>TTC</th></tr>';
  Object.keys(s.tva).sort(function(a,b){return a-b}).forEach(function(r){var x=s.tva[r];h+='<tr><td>'+tauxTxt(r)+'</td><td class="num">'+eur(x.ht)+'</td><td class="num">'+eur(x.tva)+'</td><td class="num">'+eur(x.ttc)+'</td></tr>'});
  h+='</table></div></div>';

  else{h+='<div class="card tlist">';tks.slice().reverse().forEach(function(t,i){h+='<button class="ti" data-act="voirTicket" data-i="'+(tks.length-1-i)+'"><span class="muted num">n\u00b0'+t.num+'</span><span class="num">'+hhmm(t.ferme)+'</span><span>'+esc(t.table)+' <span class="muted small">\u00b7 '+t.paiements.map(function(p){return esc(p.mode)}).join(', ')+'</span></span><b class="num">'+eur(t.total)+'</b></button>'});h+='</div>'}

    h='<h3>Carte d\u2019origine</h3><div class="confirm">Toutes vos modifications de la carte (prix, boissons ajout\u00e9es) seront perdues.</div><div class="foot"><button class="btn ghost" data-act="closeSheet">Annuler</button><button class="btn warn" data-act="resetCarte">R\u00e9tablir</button></div>';
  }
  return '<div class="ov" data-act="closeSheet"><div class="sheet" data-act="noop" role="dialog" aria-modal="true">'+h+'</div></div>';
}
function sheetItemOk(it,s){
  if(it.variantes&&s.v==null)return false;
  var gs=it.opts||it.formule||[];
  for(var i=0;i<gs.length;i++)if(!s.sel[i])return false;
  return true;
}

/* ================= ACTIONS ================= */
var toastTimer=null;
function toast(msg){var e=document.getElementById('toast');e.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.innerHTML=''},2200)}
function openTable(id,couverts){
  var n=0;
  if(id.charAt(0)==='E'){Object.keys(data.tables).forEach(function(k){if(k.charAt(0)==='E')n=Math.max(n,data.tables[k].n||0)});n++}
  var t={id:id,label:id.charAt(0)==='T'?'Table '+id.slice(1):'Emporter '+n,n:n,couverts:couverts||0,ouvert:Date.now(),lines:[],payments:[],remise:null};
  Store.saveTable(t);
  goCommande(id);
}
function goCommande(id){ui.cur=id;ui.view='commande';ui.showTicket=false;ui.sheet=null;ui.pay={montant:'',parts:1};ui.rendu=0;render()}
function addLine(it,o){
  var t=editT();if(!t)return;
  var ct=catOf(it.cat);
  var line={id:uid(),item:it.id,nom:it.nom,detail:o.detail||'',prix:o.prix,qty:o.qty||1,note:o.note||'',tva:it.tva||10,etat:'attente',cuisine:!(ct&&ct.horsCuisine)};
  var same=t.lines.filter(function(l){return l.etat==='attente'&&l.item===it.id&&l.detail===line.detail&&!l.note&&!line.note&&l.prix===line.prix&&!l.offert})[0];
  if(same)same.qty+=line.qty;else t.lines.push(line);
  ui.flash=it.id;setTimeout(function(){if(ui.flash===it.id){ui.flash=null}},700);
  Store.saveTable(t);
}
var A={
  noop:function(){},
  nav:function(d){
    ui.sheet=null;ui.showTicket=false;
    if(d.v==='commande'&&!curT())d.v='salle';
    if(d.v==='reglages')ui.reg=null;
    if(d.v==='journal')Store.watchDay(ui.jday);
    if(d.v!=='commande'&&d.v!=='encaisser'&&d.v!=='recu')ui.cur=null;
    ui.view=d.v;render();
  },
  table:function(d){
    if(data.tables[d.id])return goCommande(d.id);
    ui.sheet={type:'couverts',id:d.id,label:'Table '+d.id.slice(1),create:true,cur:0};render();
  },
  emporter:function(){openTable('E'+uid())},
  setCouverts:function(d){
    var s=ui.sheet,n=parseInt(d.n,10);
    if(s.create){ui.sheet=null;openTable(s.id,n);return}
    var t=editT();if(!t)return;t.couverts=n;ui.sheet=null;Store.saveTable(t);
  },
  sheetCouverts:function(){var t=curT();ui.sheet={type:'couverts',id:t.id,label:t.label,create:false,cur:t.couverts};render()},
  sheetOptions:function(){ui.sheet={type:'options'};render()},
  sheetTransfert:function(){ui.sheet={type:'transfert'};render()},
  transferer:function(d){
    var t=editT();if(!t||data.tables[d.id])return;
    var old=t.id;t.id=d.id;t.label='Table '+d.id.slice(1);
    ui.sheet=null;Store.saveTable(t);Store.deleteTable(old);goCommande(d.id);toast('Commande d\u00e9plac\u00e9e vers la '+t.label);
  },
  annulerAsk:function(){var t=curT();if(!t.lines.length){A.annulerYes();return}ui.sheet.confirm=true;render()},
  annulerYes:function(){var t=curT();if(!t||paye(t))return;ui.sheet=null;ui.view='salle';var id=t.id;ui.cur=null;Store.deleteTable(id)},
  cat:function(d){ui.cat=d.id;ui.scroll0=true;render()},
  item:function(d){
    var it=itemOf(d.id);if(!it)return;
    if(it.variantes||it.opts||it.formule){ui.sheet={type:'item',id:it.id,sel:{},v:null,qty:1,note:''};render();return}
    addLine(it,{prix:it.prix,qty:1});
  },
  selVar:function(d){ui.sheet.v=parseInt(d.i,10);render()},
  selOpt:function(d){ui.sheet.sel[d.g]=d.v;render()},
  sQty:function(d){ui.sheet.qty=Math.max(1,ui.sheet.qty+parseInt(d.d,10));render()},
  addFromSheet:function(){
    var s=ui.sheet,it=itemOf(s.id);if(!it||!sheetItemOk(it,s))return;
    var parts=[],prix=it.prix;
    if(it.variantes){parts.push(it.variantes[s.v].nom);prix=it.variantes[s.v].prix}
    var gs=it.opts||it.formule||[];
    if(it.formule)gs.forEach(function(g,i){parts.push(g.nom+' : '+s.sel[i])});
    else gs.forEach(function(g,i){parts.push(s.sel[i])});
    ui.sheet=null;
    addLine(it,{prix:prix,qty:s.qty,note:(s.note||'').trim(),detail:parts.join(it.formule?'\n':' \u00b7 ')});
  },
  sheetDivers:function(){ui.sheet={type:'divers',nom:'',prix:'',tva:10,cuisine:false};render()},
  dTva:function(d){ui.sheet.tva=parseFloat(d.v);render()},
  dCuisine:function(){ui.sheet.cuisine=!ui.sheet.cuisine;render()},
  dAdd:function(){
    var s=ui.sheet,p=parseMoney(s.prix),nom=(s.nom||'').trim();
    if(!nom||p==null||p<0){toast('Indiquez un libell\u00e9 et un prix');return}
    var t=editT();if(!t)return;
    t.lines.push({id:uid(),item:'libre',nom:nom,detail:'',prix:p,qty:1,note:'',tva:s.tva,etat:'attente',cuisine:!!s.cuisine});
    ui.sheet=null;Store.saveTable(t);
  },
  ligne:function(d){var t=curT(),l=t.lines.filter(function(x){return x.id===d.id})[0];if(!l)return;ui.sheet={type:'ligne',id:l.id,qty:l.qty,note:l.note||'',offert:!!l.offert,confirm:false};render()},
  lQty:function(d){ui.sheet.qty=Math.max(1,ui.sheet.qty+parseInt(d.d,10));render()},
  lOffert:function(){ui.sheet.offert=!ui.sheet.offert;render()},
  lDel:function(){ui.sheet.confirm=true;render()},
  lDelNo:function(){ui.sheet.confirm=false;render()},
  lDelYes:function(){var t=editT();if(!t)return;var id=ui.sheet.id;t.lines=t.lines.filter(function(l){return l.id!==id});ui.sheet=null;Store.saveTable(t)},
  lSave:function(){var t=editT();if(!t)return;var s=ui.sheet;t.lines.forEach(function(l){if(l.id===s.id){l.qty=s.qty;l.note=(s.note||'').trim();l.offert=s.offert}});ui.sheet=null;Store.saveTable(t)},
  showTicket:function(){ui.showTicket=true;render()},
  servir:function(){var t=editT();if(!t)return;var now=Date.now();t.lines.forEach(function(l){if(l.etat==='pret'&&l.cuisine!==false){l.etat='servi';l.ts=now}});Store.saveTable(t)},
  hideTicket:function(){ui.showTicket=false;render()},
  envoyer:function(){
    var t=editT();if(!t)return;var now=Date.now(),n=0;
    t.lines.forEach(function(l){if(l.etat==='attente'){n+=l.qty;l.t=now;if(l.cuisine===false){l.etat='servi';l.tp=now}else l.etat='envoye'}});
    if(!n)return;Store.saveTable(t);toast(n+' article'+(n>1?'s':'')+' envoy\u00e9'+(n>1?'s':''));
  },
  encaisser:function(){ui.view='encaisser';ui.showTicket=false;ui.pay={montant:'',parts:1};ui.rendu=0;render()},
  remise:function(d){var t=editT();if(!t)return;var v=parseInt(d.v,10);t.remise=v?{type:'pct',v:v}:null;Store.saveTable(t)},
  sheetRemise:function(){ui.sheet={type:'remise',v:''};render()},
  remiseEur:function(){var v=parseMoney(ui.sheet.v);var t=editT();if(!t)return;if(v==null||v<0){toast('Montant invalide');return}t.remise=v?{type:'eur',v:v}:null;ui.sheet=null;Store.saveTable(t)},
  parts:function(d){ui.pay.parts=Math.max(1,Math.min(20,ui.pay.parts+parseInt(d.d,10)));ui.pay.montant='';render()},
  payer:function(d){
    var t=editT();if(!t)return;var r=reste(t);if(r<=0)return;
    var m=parseMoney(ui.pay.montant);if(m==null||m<=0)m=defAmount(t);
    var applied=Math.min(m,r),rendu=0;
    if(m>r&&d.m==='Esp\u00e8ces')rendu=m-r;
    t.payments=(t.payments||[]).concat([{mode:d.m,montant:applied,recu:d.m==='Esp\u00e8ces'?m:applied,rendu:rendu,t:Date.now()}]);
    ui.pay.montant='';ui.rendu=rendu;Store.saveTable(t);
  },
  delPay:function(d){var t=editT();if(!t)return;t.payments.splice(parseInt(d.i,10),1);ui.rendu=0;Store.saveTable(t)},
  cloturer:async function(){
    var t=curT();if(!t||reste(t)>0||ui.busy)return;
    ui.busy=true;render();
    var st=sousTotal(t),tot=total(t);
    var tk={id:uid(),table:t.label,couverts:t.couverts||0,ouvert:t.ouvert,ferme:Date.now(),
      lignes:t.lines.map(function(l){return {nom:l.nom,detail:l.detail||'',qty:l.qty,prix:l.prix,tva:l.tva||10,offert:!!l.offert}}),
      sousTotal:st,remise:remiseM(t),total:tot,tva:tvaDetail(t.lines,st,tot),
      paiements:(t.payments||[]).map(function(p){return {mode:p.mode,montant:p.montant,recu:p.recu}}),
      rendu:(t.payments||[]).reduce(function(a,p){return a+(p.rendu||0)},0)};
    try{
      var sa=svcActif();if(sa)tk.service=sa.key;
      var saved=await Store.appendTicket(sa?sa.day:dayKey(),tk);
      var id=t.id;ui.recu=saved;ui.recuFrom='salle';ui.view='recu';ui.cur=null;ui.busy=false;
      Store.deleteTable(id);
    }catch(e){ui.busy=false;toast('Cl\u00f4ture impossible pour le moment, r\u00e9essayez');render()}
  },
  sheetOuverture:function(){
    var sa=svcActif(),dc=dernierCompte();
    ui.sheet=sa?{type:'ouverture',fond:csvNum(sa.ouverture.fond),modif:true,err:'',busy:false}:{type:'ouverture',fond:dc!=null?csvNum(dc):'',reprise:dc!=null,modif:false,err:'',busy:false};
    render();
  },
  ouvrir:async function(){
    var s=ui.sheet,f=parseMoney(s.fond);
    if(f==null||f<0){s.err='Indiquez le montant du fond de caisse (0 si vide).';render();return}
    var sa=svcActif(),day=sa?sa.day:dayKey(),key=sa?sa.key:('s'+Date.now());
    s.busy=true;render();
    try{
      await Store.ecrire('jours/'+day+'/services/'+key+'/ouverture',{fond:f,t:sa?sa.ouverture.t:Date.now(),maj:Date.now()});
      ui.sheet=null;toast(sa?'Fond de caisse modifi\u00e9':'Service ouvert');
      if(ui.view==='fermeture'){ui.view='salle'}
      render();
    }catch(e){s.busy=false;s.err='Enregistrement impossible, v\u00e9rifiez la connexion.';render()}
  },
  goFermeture:function(d){
    var x=(d&&d.key)?{day:d.day,key:d.key}:svcActif();if(!x)return;
    ui.fermSvc={day:x.day,key:x.key};ui.fermFrom=(d&&d.from)||'salle';ui.ferm={compte:'',confirm:false};ui.view='fermeture';ui.sheet=null;render();
  },
  fermAsk:function(){ui.ferm.confirm=true;render()},
  fermNo:function(){ui.ferm.confirm=false;render()},
  fermYes:async function(){
    var x=ui.fermSvc&&svcTrouve(ui.fermSvc.day,ui.fermSvc.key);if(!x||x.cloture||x.legacy||ui.busy)return;
    var tks=svcTickets(x),st=jourStats(tks),cpt=parseMoney(ui.ferm.compte);if(cpt==null)return;
    var fond=x.ouverture?x.ouverture.fond:0,att=fond+especesDe(tks);
    var cl={t:Date.now(),fond:fond,especesAttendues:att,especesComptees:cpt,ecart:cpt-att,ca:st.ca,nbTickets:st.n,couverts:st.couv,remises:st.remise,modes:{}};
    MODES.forEach(function(m){cl.modes[m]=st.modes[m]||0});
    ui.busy=true;render();
    try{await Store.ecrire('jours/'+x.day+'/services/'+x.key+'/cloture',cl);toast('Service cl\u00f4tur\u00e9')}
    catch(e){toast('Cl\u00f4ture impossible, v\u00e9rifiez la connexion')}
    ui.busy=false;ui.ferm.confirm=false;render();
  },
  imprimer:function(){try{window.print()}catch(e){toast('Impression indisponible ici')}},
  kLine:function(d){
    var t=data.tables[d.t];if(!t)return;t=clone(t);
    t.lines.forEach(function(l){if(l.id===d.id){if(l.etat==='envoye'){l.etat='pret';l.tp=Date.now()}else if(l.etat==='pret'){l.etat='envoye'}}});
    Store.saveTable(t);
  },
  kAll:function(d){var t=data.tables[d.t];if(!t)return;t=clone(t);var now=Date.now();t.lines.forEach(function(l){if(l.etat==='envoye'){l.etat='pret';l.tp=now}});Store.saveTable(t)},
  jday:function(d){var k=addDays(ui.jday,parseInt(d.d,10));if(k>dayKey())return;ui.jday=k;Store.watchDay(k);render()},
  voirTicket:function(d){var tk=jourTickets(ui.jday)[parseInt(d.i,10)];if(!tk)return;ui.recu=tk;ui.recuFrom='journal';ui.view='recu';render()},
  copier:async function(){
    var k=ui.jday,tks=jourTickets(k);if(!tks.length)return;
    var rates=[5.5,10,20];
    var head=['Date','Heure','Ticket','Service','Table','Couverts','Total TTC','Remise'];var jsv=(jourInfo(k)||{services:[]}).services;
    rates.forEach(function(r){head.push('HT '+tauxTxt(r).replace('\u00a0',' '),'TVA '+tauxTxt(r).replace('\u00a0',' '))});
    head=head.concat(MODES);
    var rows=[head.join('\t')];
    tks.forEach(function(t){
      var sv=jsv.filter(function(x){return x.key===t.service})[0];var row=[k,hhmm(t.ferme),t.num,sv?sv.n:'',String(t.table).replace(/\t/g,' '),t.couverts,csvNum(t.total),csvNum(t.remise)];
      rates.forEach(function(r){var x=t.tva.filter(function(v){return v.taux===r})[0];row.push(csvNum(x?x.ht:0),csvNum(x?x.tva:0))});
      MODES.forEach(function(m){row.push(csvNum(t.paiements.filter(function(p){return p.mode===m}).reduce(function(a,p){return a+p.montant},0)))});
      rows.push(row.join('\t'));
    });
    var txt=rows.join('\n');
    try{await navigator.clipboard.writeText(txt);toast('Journal copi\u00e9 : collez-le dans Excel');}
    catch(e){ui.sheet={type:'copie',txt:txt};render();}
  },
  saveReg:function(){
    var r=ui.reg,nb=parseInt(r.nb,10);
    if(!(nb>=1&&nb<=80)){toast('Nombre de tables entre 1 et 80');return}
    var c=clone(data.config||{});c.nom=(r.nom||'').trim()||'Les Jardins du Val d\u2019Ornain';c.adresse=(r.adresse||'').trim();c.nbTables=nb;
    Store.saveConfig(c);toast('R\u00e9glages enregistr\u00e9s');
  },
  editItem:function(d){
    var it=itemOf(d.id);if(!it)return;
    ui.sheet={type:'edit',id:it.id,nom:it.nom,prix:it.variantes?'':csvNum(it.prix),tva:it.tva||10,cat:it.cat,
      variantes:it.variantes?clone(it.variantes):null,vp:it.variantes?it.variantes.map(function(v){return csvNum(v.prix)}):null,
      formule:it.formule?it.formule.map(function(g){return {nom:g.nom,txt:g.choix.join('\n')}}):null,confirm:false,err:''};
    render();
  },
  newItem:function(d){var ct=catOf(d.cat);ui.sheet={type:'edit',id:null,nom:'',prix:'',tva:ct&&ct.horsCuisine?20:10,cat:d.cat,variantes:null,vp:null,confirm:false,err:''};render()},
  eTva:function(d){ui.sheet.tva=parseFloat(d.v);render()},
  eCat:function(d){ui.sheet.cat=d.v;render()},
  eSave:function(){
    var s=ui.sheet,nom=(s.nom||'').trim();
    if(!nom){s.err='Le nom est obligatoire.';render();return}
    var carte=clone(cfg().carte),prix=null,vars=null;
    if(s.variantes){vars=s.variantes.map(function(v,i){return {nom:v.nom,prix:parseMoney(s.vp[i])}});if(vars.some(function(v){return v.prix==null||v.prix<0})){s.err='Prix invalide.';render();return}}
    else{prix=parseMoney(s.prix);if(prix==null||prix<0){s.err='Prix invalide.';render();return}}
    var fo=null;
    if(s.formule){fo=s.formule.map(function(g){return {nom:g.nom,choix:String(g.txt||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}});if(fo.some(function(g){return !g.choix.length})){s.err='Chaque partie de la formule doit avoir au moins un choix.';render();return}}
    if(s.id){carte.items.forEach(function(it){if(it.id===s.id){it.nom=nom;it.tva=s.tva;it.cat=s.cat;if(fo)it.formule=fo;if(vars){it.variantes=vars;it.prix=vars[0].prix}else it.prix=prix}})}
    else carte.items.push({id:'x-'+uid(),cat:s.cat,nom:nom,prix:prix,tva:s.tva});
    var c=clone(data.config||{});c.carte=carte;ui.sheet=null;Store.saveConfig(c);
  },
  eDel:function(){ui.sheet.confirm=true;render()},
  eDelNo:function(){ui.sheet.confirm=false;render()},
  eDelYes:function(){var id=ui.sheet.id,carte=clone(cfg().carte);carte.items=carte.items.filter(function(i){return i.id!==id});carte.supprimes=(carte.supprimes||[]).concat([id]);var c=clone(data.config||{});c.carte=carte;ui.sheet=null;Store.saveConfig(c)},
  sheetResetCarte:function(){ui.sheet={type:'resetCarte'};render()},
  resetCarte:function(){var c=clone(data.config||{});delete c.carte;ui.sheet=null;Store.saveConfig(c);toast('Carte d\u2019origine r\u00e9tablie')},
  closeSheet:function(){ui.sheet=null;render()}
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=A[el.dataset.act];if(!f)return;
  if(el.dataset.act==='noop'){return}
  e.preventDefault();f(el.dataset,el,e);
});
document.addEventListener('input',function(e){
  var el=e.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  var p=b.split('.'),o=ui;
  for(var i=0;i<p.length-1;i++){o=o[p[i]];if(o==null)return}
  o[p[p.length-1]]=el.value;
  if(el.dataset.live)render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render()}});
setInterval(function(){if(!ui.sheet&&(ui.view==='salle'||ui.view==='cuisine'))render()},30000);
Store.start();
</script>
